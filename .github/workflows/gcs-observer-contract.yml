name: GCS Observer Contract

on:
  push:
    branches: [main]
    paths:
      - 'integrations/gcs-observer/**'
      - 'docs/integrations/gcs-observer-phase0.md'
      - '.github/workflows/gcs-observer-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integrations/gcs-observer/**'
      - 'docs/integrations/gcs-observer-phase0.md'
      - '.github/workflows/gcs-observer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Run read-only observer contract tests
        run: node --test integrations/gcs-observer/observer-client.test.mjs
